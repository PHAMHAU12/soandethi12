<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý tài khoản</title>
<style>
body{font:14px system-ui,sans-serif;margin:0;background:#eef0f5;color:#1c2030}
main{max-width:820px;margin:20px auto;padding:0 12px}
.card{background:#fff;border:1px solid #d5d9e4;border-radius:10px;padding:14px;margin-bottom:14px}
input,select,button{font:inherit;padding:6px 9px;border:1px solid #cfd4e2;border-radius:6px}
button{cursor:pointer;background:#fff}button.p{background:#4f46e5;color:#fff;border-color:#4f46e5}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-top:1px solid #e3e6ef;text-align:left}
.row{display:flex;gap:6px;flex-wrap:wrap}#msg{color:#c0392b;min-height:20px}
</style></head><body><main>
<p><a href="/">← Về trang soạn đề</a></p>
<div class="card"><h2 style="margin-top:0">Tạo tài khoản</h2>
<div class="row"><input id="n" placeholder="Họ và tên"><input id="u" placeholder="Tên đăng nhập (không dấu)"><input id="p" placeholder="Mật khẩu (≥ 6 ký tự)">
<select id="r"><option value="student">Học sinh</option><option value="teacher">Giáo viên</option></select><button class="p" id="add">+ Tạo</button></div>
<p id="msg"></p></div>
<div class="card"><h2 style="margin-top:0">Danh sách tài khoản</h2><table id="t"></table></div>
</main>
<script>
const H={'X-Requested-With':'fetch','Content-Type':'application/json'};
const api=(u,o)=>fetch(u,Object.assign({credentials:'same-origin',headers:H},o)).then(async r=>{const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||('Lỗi '+r.status));return b});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){try{const {users}=await api('/api/users');document.getElementById('t').innerHTML='<tr><th>Họ tên</th><th>Tên đăng nhập</th><th>Vai trò</th><th></th></tr>'+users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${u.role==='teacher'?'Giáo viên':'Học sinh'}</td><td><button data-a="pw" data-i="${u.id}">Đổi mật khẩu</button> <button data-a="del" data-i="${u.id}">Xoá</button></td></tr>`).join('')}catch(e){document.getElementById('msg').textContent=e.message+' (cần đăng nhập bằng tài khoản giáo viên ở trang chính)'}}
document.getElementById('add').onclick=async()=>{const m=document.getElementById('msg');m.textContent='';try{await api('/api/users',{method:'POST',body:JSON.stringify({name:n.value,username:u.value,password:p.value,role:r.value})});n.value=u.value=p.value='';load()}catch(e){m.textContent=e.message}};
document.getElementById('t').onclick=async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.a==='del'){if(confirm('Xoá tài khoản này?')){await api('/api/users/'+b.dataset.i,{method:'DELETE'});load()}}else{const pw=prompt('Mật khẩu mới (≥ 6 ký tự):');if(pw){await api('/api/users/'+b.dataset.i,{method:'PUT',body:JSON.stringify({password:pw})});alert('Đã đổi mật khẩu.')}}}catch(x){document.getElementById('msg').textContent=x.message}};
load();
</script></body></html>
